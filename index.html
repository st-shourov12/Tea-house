<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea house</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./assets/styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    

</head>
<body>
    <header class="header pt-[68px] pb-[120px] px-[230px] max-w-[1600px] mx-auto flex justify-between gap-4 bg-[#f4f4f4]">
        <div class="header-content">
            <h1 class="hero-title text-[80px] font-extrabold leading-24">
                It's good <br>
                tea time at The Tea House
            </h1>
            <p class="mt-[30px] hero-description text-[18px] leading-[30px] font-medium text-[#777777]">
                Tea and Botanical Solutions Supplier Give Optimum Satisfaction To Your Taste Buds.
            </p>
            <button class="mt-[30px] btn-primary text-xl font-semibold leading-[100%] text-center px-5 py-[18px] flex gap-2.5 text-white rounded-xl">
                Explore More
                <img src="./assets/images/arrow.png" alt="">
            </button>
        </div>
        <div class="header-img relative">
            <img src="./assets/images/banner.png" class="relative top-[120px] max-w-[640px] max-h-[500px]" alt="">
            <div class="ratting flex gap-3.5 px-[26px] py-[18px] items-center rounded-xl bg-[#ffffff] absolute left-24 shadow-md">
                <img src="./assets/images/Group 5.png" alt="">
                <div class="rate">
                    <h3 class="text-[30px]">5.00</h3>
                    <h5 class="text-[#777777]">Trust Pilot Ratings</h5>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
